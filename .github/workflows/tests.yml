name: route-engine-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyflakes && python -m pyflakes MCP_Trails_Complete_Notebook.py test_route_engine.py
      - run: python test_route_engine.py
